<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Hermes for Dodo</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; }
        #chat { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Hermes 助手</h1>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="请输入...">
    <button onclick="send()">发送</button>
    <script>
        async function send() {
            const input = document.getElementById('msg');
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input.value})
            });
            const data = await res.json();
            document.getElementById('chat').innerHTML += `<p><b>你:</b> ${input.value}</p><p><b>Hermes:</b> ${data.response}</p>`;
            input.value = '';
        }
    </script>
</body>
</html>
