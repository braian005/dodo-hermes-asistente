<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Hermes - Dodo's Assistant</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background: #f4f7f6; }
        #app { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 15px; }
        #chat { height: 350px; overflow-y: auto; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        input { width: 60%; padding: 10px; }
        .upload-btn { background: #6c757d; color: white; padding: 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>Hermes 助手</h2>
        <div id="chat"></div>
        <input type="text" id="msg" placeholder="请输入指令...">
        <button onclick="send()">发送</button>
        <input type="file" id="fileInput" style="display:none" onchange="uploadFile()">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">上传文件</button>
    </div>
    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            await fetch('/upload', { method: 'POST', body: formData });
            alert('文件上传成功: ' + file.name);
        }
        async function send() {
            const input = document.getElementById('msg');
            const msg = input.value;
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const data = await res.json();
            document.getElementById('chat').innerHTML += `<p><b>Hermes:</b> ${data.response}</p>`;
            input.value = '';
        }
    </script>
</body>
</html>
